{{define "alert-success"}}
<!-- Placeholders: .SuccessTitle (string), .SuccessMessage (string) -->
<div class="bg-green-50 border border-green-200 rounded-lg p-6 mb-6">
  <div class="flex">
    <div class="flex-shrink-0">
      <img src="/static/assets/icons/heroicons/outline/check-circle.svg" alt="" class="h-5 w-5 text-green-400" />
    </div>
    <div class="ml-3">
      <h3 class="text-sm font-medium text-green-800">{{.SuccessTitle}}</h3>
      <div class="mt-2 text-sm text-green-700">
        <p>{{.SuccessMessage}}</p>
      </div>
    </div>
  </div>
</div>
{{end}}
