{{define "form-field-floating"}}
<!--
  Parámetros vía .Field:
  .Field.ID, .Field.Name, .Field.Label, .Field.Type, .Field.Value,
  .Field.Invalid (bool), .Field.Error (string), .Field.Disabled (bool)
-->
<div class="form__group">
  <div class="relative">
    <input
      type="{{.Field.Type}}"
      id="{{.Field.ID}}"
      name="{{.Field.Name}}"
      value="{{.Field.Value}}"
      class="peer block{{if .Field.Invalid}} is__invalid-input{{end}}"
      placeholder=" "
      {{if .Field.Disabled}}disabled{{end}} />
    <label
      for="{{.Field.ID}}"
      class="bg-background text-muted-foreground peer-focus:text-primary absolute top-2 z-10 origin-[0] -translate-y-4 scale-95 transform px-2 text-sm duration-300 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:scale-100 peer-focus:top-2 peer-focus:-translate-y-4 peer-focus:scale-95 peer-focus:px-2 ltr:left-1 rtl:right-1{{if .Field.Invalid}} peer-focus:text-destructive!{{end}}">
      {{.Field.Label}}
    </label>
    {{if eq .Field.Type "password"}}
    <span
      class="text-muted-foreground absolute top-2 cursor-pointer ltr:right-3 rtl:left-3"
      onclick="togglePassword('{{.Field.ID}}', this)"
      role="button"
      tabindex="0"
      aria-label="Mostrar u ocultar contraseña">
      <img src="/static/assets/icons/heroicons/outline/eye-off.svg" alt="" class="h-5 w-5 password-toggle-icon" data-visible-icon="/static/assets/icons/heroicons/outline/eye.svg" data-hidden-icon="/static/assets/icons/heroicons/outline/eye-off.svg" />
    </span>
    {{end}}
  </div>
  {{if .Field.Invalid}}
  <div class="is__invalid-error">
    <div>{{.Field.Error}}</div>
  </div>
  {{end}}
</div>
{{end}}
