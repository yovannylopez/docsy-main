{{define "modal-shell"}}
<!--
  Placeholders:
  .ModalID (string), .ModalTitle (string), .ModalMessage (string),
  .ConfirmText (string), .CancelText (string),
  .ConfirmURL (string), .ConfirmMethod (string, default POST),
  .HeaderTone (string: warning|danger|success|info)
-->
<div id="{{.ModalID}}" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm hidden" role="dialog" aria-modal="true">
  <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4 overflow-hidden modal-content">
    <div class="px-6 py-4 flex items-center justify-between {{if eq .HeaderTone "success"}}bg-green-500 text-white{{else if eq .HeaderTone "danger"}}bg-red-600 text-white{{else}}bg-orange-500 text-white{{end}}">
      <div class="flex items-center space-x-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
        <h3 class="text-xl font-semibold">{{.ModalTitle}}</h3>
      </div>
      <button type="button" onclick="closeModal('{{.ModalID}}')" class="text-white hover:text-gray-200 transition-colors" aria-label="Cerrar">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <div class="px-6 py-6">
      <div class="text-center mb-6">
        <svg class="w-16 h-16 mx-auto mb-4 icon-orange icon-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
        <p class="text-gray-700 text-lg leading-relaxed">{{.ModalMessage}}</p>
      </div>
    </div>

    <div class="bg-gray-50 px-6 py-4 flex justify-end gap-3">
      <button type="button" onclick="closeModal('{{.ModalID}}')" class="px-6 py-2 rounded-lg text-gray-700 bg-white border border-gray-300 font-medium transition-all duration-200 hover:bg-gray-50 hover:shadow-md">
        {{.CancelText}}
      </button>
      <!-- HTMX: hx-post="{{.ConfirmURL}}" hx-target="#main-content" hx-swap="innerHTML" -->
      <button
        type="button"
        class="px-6 py-2 rounded-lg text-white font-medium transition-all duration-200 hover:shadow-md {{if eq .HeaderTone "danger"}}bg-red-600 hover:bg-red-700{{else}}bg-orange-500 hover:bg-orange-600{{end}}"
        data-modal-confirm="{{.ModalID}}"
        data-confirm-url="{{.ConfirmURL}}">
        {{.ConfirmText}}
      </button>
    </div>
  </div>
</div>
{{end}}
