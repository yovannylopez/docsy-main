{{define "table-pagination"}}
<!--
  Placeholders:
  .Offset (int), .Limit (int), .Total (int),
  .HasPrevious (bool), .HasNext (bool),
  .PrevURL (string), .NextURL (string)
-->
<div class="bg-white px-4 py-3 flex items-center justify-between border-t border-gray-200 sm:px-6 mt-4 rounded-lg shadow-md">
  <div class="flex-1 flex justify-between sm:hidden">
    <a
      href="{{.PrevURL}}"
      class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 {{if not .HasPrevious}}pointer-events-none opacity-50{{end}}">
      Anterior
    </a>
    <a
      href="{{.NextURL}}"
      class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 {{if not .HasNext}}pointer-events-none opacity-50{{end}}">
      Siguiente
    </a>
  </div>
  <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
    <div>
      <p class="text-sm text-gray-700">
        Mostrando <span class="font-medium">{{.PageStart}}</span> a
        <span class="font-medium">{{.PageEnd}}</span> de
        <span class="font-medium">{{.Total}}</span> resultados
      </p>
    </div>
    <div>
      <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px">
        <a
          href="{{.PrevURL}}"
          class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 {{if not .HasPrevious}}pointer-events-none opacity-50{{end}}">
          <span class="sr-only">Anterior</span>
          <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
          </svg>
        </a>
        <a
          href="{{.NextURL}}"
          class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 {{if not .HasNext}}pointer-events-none opacity-50{{end}}">
          <span class="sr-only">Siguiente</span>
          <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
          </svg>
        </a>
      </nav>
    </div>
  </div>
</div>
{{end}}
